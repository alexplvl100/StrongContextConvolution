# Патч: SCC вместо штатной компакции
# ====================================
# Проверен `--dump-config` 2026-10-26: предупреждений нет, обе строки
# применяются. Описан в ../ROLLOUT.md §3.3.
#
# ПРИМЕНЕНИЕ (рабочая конфигурация НЕ трогается):
#   DSH_HOME=/tmp/scc_iso/home dsh --profile scc-test \
#     --patch rollout/deepseek-harness/plugin/method.patch.yml --dump-config
#
# ВАЖНО: применять только с изолированным DSH_HOME. Этот патч заменяет
# штатный движок компакции — в рабочем профиле это остановит исследования.

# ── 1. Отключить штатную компакцию ───────────────────────────────────────────
# Обязательно: сервис `compaction` — синглтон, вторая регистрация бросает
# `service "compaction" has been registered at <...>`. «Рядом» поставить нельзя.
- id: compaction-basic
  disabled: true

# ── 2. Добавить движок SCC ───────────────────────────────────────────────────
# Без `insert` новую строку добавить НЕЛЬЗЯ: патч с неизвестным `id` даёт
# `patch: entry "scc-compaction" not found` (проверено).
#
# Путь к модулю: абсолютный, либо относительный от каталога профиля.
# Заменить на фактический путь перед запуском.
- insert:
    - id: scc-compaction
      name: '/tmp/scc_iso/plugin/index.js'
      config:
        # Доля окна, при которой срабатывает сжатие.
        # Штатное значение 0.8; SCC можно включать раньше или позже.
        thresholdRatio: 0.7

        # Сколько этапов ядра выполнять: 3 — полный цикл, 1 — только WR.
        # Полный цикл точнее, но это три вызова модели (148 с на небольшом
        # контексте, измерено).
        sccStage: 3

        # Таймаут на этап. Штатные таймауты для трёх вызовов модели МАЛЫ:
        # измерено 30+40+78 = 148 с на контексте 57 КБ.
        sccTimeoutMs: 300000

        # Без постфикса: в режиме компакции маркер нужен для повторной
        # свёртки. Если повторная свёртка не планируется — можно отключить.
        sccNoMarker: false
